[project]
name = "bili"
version = "0.1.0"
description = "Bilibili video downloader with audio extraction and vocal separation"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
]

[project.optional-dependencies]
vocals = [
    "torch",
    "demucs",
    "soundfile",
]

[project.scripts]
bili = "scripts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
