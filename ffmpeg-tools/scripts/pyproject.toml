[project]
name = "video-ops"
version = "1.0.0"
description = "Video processing utilities using ffmpeg"
requires-python = ">=3.12"
dependencies = [
    "ffmpeg-python>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = []
